<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Algebra Tiles : Ubin Aljabar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;600;700;800&display=swap');

:root{
  --u: clamp(24px, 4.2vw, 34px);
  --len: calc(var(--u) * 3);
  --bg:#F5F3ED;
  --panel:#FFFFFF;
  --ink:#232733;
  --ink-soft:#6B7280;
  --primary:#3454D1;
  --primary-dark:#25399C;
  --accent:#FFB100;
  --accent-dark:#C97F00;
  --pos:#2F9E68;
  --pos-dark:#1F7A50;
  --neg:#E23E57;
  --neg-dark:#B5253C;
  --success:#2F9E68;
  --danger:#E23E57;
  --line:#E4E0D4;
  --radius:18px;
  --shadow: 0 8px 24px rgba(35,39,51,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{height:100%;margin:0;}
body{
  font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink);
  height:100dvh; height:100vh; overflow:hidden; display:flex; flex-direction:column;
}
h1,h2,h3,.brand,.headline{font-family:'Baloo 2',cursive;}
button{font-family:inherit;}
#app{display:flex;flex-direction:column;height:100%;}

/* ===== APPBAR ===== */
.appbar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 16px; background:linear-gradient(120deg,var(--primary),var(--primary-dark));
  color:#fff; box-shadow:0 2px 14px rgba(0,0,0,.18); z-index:30; flex-shrink:0;
}
.appbar .left{display:flex;align-items:center;gap:10px;min-width:0;}
.brand{font-weight:700;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand small{display:block;font-family:'Inter';font-weight:400;font-size:.68rem;opacity:.85;}
.iconbtn{
  background:rgba(255,255,255,.2); border:none; color:#fff; width:40px;height:40px;border-radius:12px;
  font-size:1.1rem; cursor:pointer; display:flex; align-items:center;justify-content:center; flex-shrink:0;
}
.iconbtn:active{transform:scale(0.92);}
.level-pill{
  background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.5); padding:6px 14px;
  border-radius:20px; font-weight:800; font-size:.85rem; white-space:nowrap;
}

/* ===== SCREENS ===== */
#view{flex:1; position:relative; overflow:hidden;}
.screen{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; display:none; -webkit-overflow-scrolling:touch;}
.screen.active{display:block;}

/* ===== HOME ===== */
.home-wrap{max-width:720px;margin:0 auto;padding:20px 16px 70px;}
.hero{
  background:linear-gradient(135deg,#fff,#EFF2FF); border:1px solid var(--line); border-radius:24px;
  padding:22px 20px; box-shadow:var(--shadow); margin-bottom:22px; position:relative; overflow:hidden;
}
.hero h1{font-size:1.5rem;margin:0 0 6px;color:var(--primary-dark);}
.hero p{margin:0 0 14px;color:var(--ink-soft);line-height:1.5;font-size:.95rem;}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
.legend-item{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;color:var(--ink-soft);}
.legend-swatch{width:20px;height:20px;border-radius:5px;flex-shrink:0;}

.progress-track{background:var(--line);height:8px;border-radius:6px;overflow:hidden;margin-top:14px;}
.progress-fill{background:linear-gradient(90deg,var(--pos),#54c98a);height:100%;border-radius:6px;transition:width .4s;}

/* ===== MODE SELECT ===== */
.mode-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:6px;}
@media (min-width:640px){ .mode-grid{grid-template-columns:1fr 1fr;} }
.mode-card{
  background:var(--panel); border:2px solid var(--line); border-radius:20px; padding:20px 18px;
  box-shadow:var(--shadow); cursor:pointer; transition:transform .15s, border-color .15s; text-align:left;
}
.mode-card:active{transform:scale(0.98);}
.mode-card:hover{border-color:var(--primary);}
.mode-card .mode-icon{font-size:2rem;margin-bottom:8px;}
.mode-card h3{margin:0 0 6px;font-size:1.1rem;color:var(--primary-dark);}
.mode-card p{margin:0;font-size:.86rem;color:var(--ink-soft);line-height:1.5;}
.mode-card .mode-tag{display:inline-block;margin-top:10px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:3px 10px;border-radius:20px;background:#E7ECFC;color:var(--primary);}

.path{position:relative;padding-left:6px;}
.node{
  display:flex; gap:16px; align-items:flex-start; position:relative; padding-bottom:26px; cursor:pointer;
}
.node:last-child{padding-bottom:0;}
.node::before{
  content:''; position:absolute; left:27px; top:56px; bottom:0; width:3px; background:var(--line); z-index:0;
}
.node:last-child::before{display:none;}
.node.done::before{background:var(--pos);}
.node-badge{
  width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:1.4rem; flex-shrink:0; z-index:1; box-shadow:0 4px 10px rgba(0,0,0,.12); border:3px solid #fff;
  background:#D9DCE6; color:#8A8FA3;
}
.node.unlocked .node-badge{background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff;}
.node.done .node-badge{background:linear-gradient(135deg,var(--pos),var(--pos-dark)); color:#fff;}
.node-card{
  flex:1; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 16px;
  box-shadow:0 2px 8px rgba(0,0,0,.05); transition:transform .15s;
}
.node.locked .node-card{opacity:.55;}
.node:not(.locked):active .node-card{transform:scale(0.98);}
.node-title{font-weight:800;font-size:1rem;margin-bottom:3px;}
.node-desc{font-size:.83rem;color:var(--ink-soft);line-height:1.4;margin-bottom:8px;}
.node-status{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:3px 10px;border-radius:20px;display:inline-block;}
.node-status.locked{background:#EDEEF3;color:#9096A8;}
.node-status.unlocked{background:#E7ECFC;color:var(--primary);}
.node-status.done{background:#E4F6EC;color:var(--pos-dark);}

/* ===== BUTTONS ===== */
.btn{
  border:none;border-radius:12px;font-weight:800;cursor:pointer;padding:12px 18px;font-size:.95rem;
  transition:transform .12s, box-shadow .12s; text-align:center;
}
.btn:active{transform:translateY(2px);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-dark);}
.btn-accent{background:var(--accent);color:#4a3400;box-shadow:0 4px 0 var(--accent-dark);}
.btn-ghost{background:#fff;color:var(--primary);border:2px solid var(--primary);}
.btn-clear{background:#ECEEF2;color:#6B7280;box-shadow:0 4px 0 #D7DAE1;}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 4px 0 var(--neg-dark);}
.btn-block{display:block;width:100%;margin-bottom:10px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

/* ===== MODULE LAYOUT ===== */
.module-layout{display:flex; height:100%;}
.panel-bank{
  width:220px; background:var(--panel); padding:14px; overflow-y:auto; border-right:1px solid var(--line);
  flex-shrink:0; display:flex; flex-direction:column; gap:12px;
}
.panel-bank h3{font-size:.78rem;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.5px;margin:0 0 6px;}
.bank-group{background:var(--bg);border-radius:14px;padding:10px;}
.bank-row{display:flex;gap:10px;align-items:flex-end;justify-content:center;flex-wrap:wrap;}
.bank-slot{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:grab;padding:4px;border-radius:10px;border:2px solid transparent;touch-action:none;}
.bank-slot.selected{border-color:var(--primary);background:#EAF0FF;opacity:.45;}
.bank-slot .lbl{font-size:.68rem;font-weight:800;color:var(--ink-soft);}
.legend-mini{margin-top:auto;font-size:.72rem;color:var(--ink-soft);line-height:1.5;background:var(--bg);border-radius:12px;padding:10px;}

.panel-work{flex:1; position:relative; overflow:auto; display:flex; flex-direction:column; align-items:center; padding:16px;
  background-image: radial-gradient(circle, #E7E4D8 1.5px, transparent 1.5px); background-size:26px 26px;
}
.work-toolbar{display:flex; gap:10px; align-items:center; justify-content:center; margin-bottom:14px; flex-wrap:wrap;}
.pill{background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-weight:800;font-size:.85rem;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.05);color:var(--primary-dark);}
.expr-pill{background:var(--ink);color:#fff;border-radius:20px;padding:8px 18px;font-weight:800;font-size:1rem;font-family:'Courier New',monospace;}
.work-area{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; min-height:200px;}

.panel-status{
  width:300px; background:var(--panel); padding:16px; border-left:1px solid var(--line); overflow-y:auto;
  flex-shrink:0; display:flex; flex-direction:column;
}
.mission-card{background:#FDF6EC; border:2px solid #F3D9A8; border-radius:16px; padding:14px 16px; margin-bottom:14px;}
.mission-badge{display:inline-block;background:var(--accent);color:#4a3400;font-size:.68rem;font-weight:800;padding:2px 10px;border-radius:10px;text-transform:uppercase;margin-bottom:6px;}
.mission-title{font-weight:800;font-size:1.02rem;margin-bottom:6px;color:#8A5300;}
.mission-desc{font-size:.88rem;line-height:1.55;color:#4a4436;}
.mission-desc b{color:#232733;}
.mission-hint{margin-top:8px;font-size:.8rem;background:#EAF3FF;border-left:4px solid var(--primary);padding:8px 10px;border-radius:0 8px 8px 0;color:var(--primary-dark);}
.status-box{background:var(--bg);border-radius:12px;padding:10px 14px;text-align:center;margin-bottom:14px;}
.status-label{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;font-weight:800;letter-spacing:.5px;}
.status-val{font-size:1.15rem;font-weight:800;font-family:'Courier New',monospace;color:var(--primary-dark);}
.status-actions{margin-top:auto;}

/* ===== FREEBOARD ===== */
.freeboard-area{
  width:100%; max-width:560px; min-height:200px; background:rgba(255,255,255,.7); border:3px dashed #C9C4B2;
  border-radius:18px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:6px; padding:16px;
}
.freeboard-area.empty::after{content:'Seret ubin dari Bank Ubin ke area ini untuk menaruhnya.'; color:#9A947F; font-style:italic; font-size:.85rem;}

/* ===== TILES ===== */
.tile{display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;border-radius:7px;
  user-select:none; box-shadow:inset 0 -4px 0 rgba(0,0,0,.14), 0 2px 5px rgba(0,0,0,.18); position:relative; cursor:pointer;}
.tile.pos{background:var(--pos);}
.tile.neg{background:var(--neg);}
.tile.placeholder{background:transparent;box-shadow:none;border:2px dashed #C9C4B2;cursor:pointer;}
.tile.locked{cursor:default;}
.tile:active{transform:scale(0.94);}

.sz-board.t-x2{width:var(--len);height:var(--len);font-size:calc(var(--u)*.5);}
.sz-board.t-x{width:var(--u);height:var(--len);font-size:calc(var(--u)*.4);}
.sz-board.t-x.horiz{width:var(--len);height:var(--u);}
.sz-board.t-unit{width:var(--u);height:var(--u);font-size:calc(var(--u)*.4);}

.sz-bank.t-x2{width:52px;height:52px;font-size:1.15rem;}
.sz-bank.t-x{width:20px;height:52px;font-size:.72rem;}
.sz-bank.t-unit{width:26px;height:26px;font-size:.68rem;}

.sz-mini.t-x2{width:30px;height:30px;font-size:.72rem;}
.sz-mini.t-x{width:12px;height:30px;font-size:.5rem;}
.sz-mini.t-unit{width:15px;height:15px;font-size:.5rem;}

.fade-out{animation:fadeOut .7s forwards;}
@keyframes fadeOut{0%{transform:scale(1);opacity:1;}50%{transform:scale(1.25);opacity:.6;filter:brightness(1.4);}100%{transform:scale(0);opacity:0;}}
.pop-in{animation:popIn .25s cubic-bezier(.175,.885,.32,1.275);}
@keyframes popIn{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}

/* ===== DRAG & DROP (Bank Ubin -> area kerja) ===== */
.drag-ghost{position:fixed;top:0;left:0;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);filter:drop-shadow(0 10px 16px rgba(0,0,0,.35));opacity:.95;}
.dropzone{transition:box-shadow .1s, background-color .1s;}
.dropzone-hover{box-shadow:inset 0 0 0 3px var(--primary);background-color:rgba(52,84,209,.08);}

/* ===== AREA MODEL ===== */
.area-wrap{display:grid; grid-template-columns:auto auto; grid-template-rows:auto auto; gap:6px; background:#fff; padding:18px; border-radius:18px; box-shadow:var(--shadow);}
.corner{width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);}
.zone{display:flex; gap:4px; border:2px dashed #C9C4B2; border-radius:10px; padding:6px; background:#FAFAF7; cursor:pointer; min-width:calc(var(--u)*1.1); min-height:calc(var(--u)*1.1);}
.zone.top{flex-direction:row; align-items:flex-end; border-bottom:3px solid #C9C4B2;}
.zone.left{flex-direction:column; align-items:flex-end; border-right:3px solid #C9C4B2;}
.grid-wrap{display:grid; gap:4px; padding:6px; border:2px dashed #C9C4B2; border-radius:10px; background:#FCFCFA; min-width:calc(var(--u)*1.1); min-height:calc(var(--u)*1.1);}
.grid-cell{background:rgba(230,230,222,.5); border:1px dashed #D7D3C4; border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.grid-cell.err{outline:3px solid var(--danger);}
.grid-placeholder{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;color:#9A947F;font-style:italic;font-size:.8rem;text-align:center;padding:10px;}

/* ===== SCALE (PLSV) — Timbangan animasi naik-turun ===== */
.scale-wrap{display:flex; flex-direction:column; align-items:center; gap:4px; width:100%; max-width:640px;}
.eq-display{background:#fff; border:3px solid var(--line); border-radius:24px; padding:12px 26px; font-family:'Courier New',monospace; font-weight:800; font-size:1.5rem; color:var(--primary-dark); box-shadow:var(--shadow); margin-bottom:10px;}
.step-progress{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
.step-dot{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .2s, transform .2s;}
.step-dot.done{background:var(--pos);}
.step-dot.now{background:var(--primary);transform:scale(1.35);}

.scale-rig{position:relative; width:100%; padding-top:26px; padding-bottom:6px;}
.pivot-stand{position:absolute; left:50%; top:44px; transform:translateX(-50%); width:0; height:0;
  border-left:18px solid transparent; border-right:18px solid transparent; border-top:40px solid #8A8FA3; z-index:0;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.15));}
.pivot-cap{position:absolute; left:50%; top:36px; transform:translateX(-50%); width:18px; height:18px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff, #8A8FA3 70%); z-index:3; box-shadow:0 2px 4px rgba(0,0,0,.3);}
.beam-bar{position:absolute; left:50%; top:38px; width:78%; height:9px; margin-left:-39%;
  background:linear-gradient(180deg,#C7CCD9,#8A8FA3); border-radius:6px; transform-origin:50% 50%;
  transition:transform .55s cubic-bezier(.34,1.56,.64,1); box-shadow:0 3px 6px rgba(0,0,0,.2); z-index:1;}
.pan-row{display:flex; align-items:flex-start; gap:18px; width:100%; position:relative; margin-top:56px; z-index:2;}
.pan-col{flex:1; display:flex; flex-direction:column; align-items:stretch;
  transition:transform .55s cubic-bezier(.34,1.56,.64,1);}
.pan-col .chain{width:3px; height:20px; background:repeating-linear-gradient(#B7BDCB,#B7BDCB 4px,transparent 4px,transparent 7px); margin:0 auto 2px;}
.pan-label{text-align:center;font-weight:800;color:var(--ink-soft);font-size:.8rem;margin-bottom:4px;}
.pan{min-height:150px; background:rgba(255,255,255,.85); border:3px dashed #C9C4B2; border-radius:16px 16px 26px 26px; padding:10px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:5px; cursor:pointer; box-shadow:0 6px 14px rgba(0,0,0,.08);}
.pan.tip-heavy{border-color:var(--accent-dark); background:rgba(255,177,0,.08);}
.tilt-hint{text-align:center;font-size:.72rem;color:var(--ink-soft);margin-top:8px;font-style:italic;}

/* Animasi "hilangkan pasangan nol" — ubin membesar sekilas lalu menyusut & memudar */
@keyframes zeroVanish{
  0%{ transform:scale(1); opacity:1; }
  40%{ transform:scale(1.28); opacity:.9; filter:brightness(1.5); }
  100%{ transform:scale(0); opacity:0; }
}
.zero-pair-anim{ animation:zeroVanish .6s ease forwards; pointer-events:none; }

/* ===== BAGI RATA (drag & drop) ===== */
.divide-board{display:flex; flex-direction:column; align-items:center; gap:18px; width:100%; max-width:680px;}
.divide-groups-row{display:flex; gap:18px; flex-wrap:wrap; justify-content:center; width:100%;}
.divide-group-col{display:flex; flex-direction:column; align-items:center; gap:8px; background:#fff; border:2px solid var(--line); border-radius:16px; padding:12px 10px; box-shadow:var(--shadow); min-width:96px;}
.divide-group-caption{font-size:.72rem;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
.divide-group-zone{min-height:110px; width:100%; background:var(--bg); border:2px dashed #C9C4B2; border-radius:12px; padding:8px; display:flex; flex-wrap:wrap; align-content:flex-start; justify-content:center; gap:5px; cursor:pointer;}
.divide-group-zone.divide-balanced{border-color:var(--pos); background:rgba(47,158,104,.08);}
.divide-pool{width:100%; background:#fff; border:2px dashed var(--primary); border-radius:16px; padding:12px; box-shadow:var(--shadow);}
.divide-pool.divide-empty{border-color:var(--pos); background:rgba(47,158,104,.06);}
.divide-pool-label{font-size:.78rem;font-weight:800;color:var(--primary-dark);margin-bottom:8px;text-align:center;}
.divide-pool.divide-empty .divide-pool-label{color:var(--pos-dark);}
.divide-pool-tiles{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; min-height:40px;}
.divide-hint-text{text-align:center;font-size:.78rem;color:var(--ink-soft);max-width:520px;line-height:1.5;}
.divide-input-row{display:flex;align-items:center;gap:8px;margin-top:6px;}
.divide-input-row .xlbl{font-weight:800;font-family:'Courier New',monospace;font-size:1.05rem;color:var(--primary-dark);}
.divide-input{width:90px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;font-size:1rem;font-weight:700;font-family:'Courier New',monospace;color:var(--ink);text-align:center;}
.divide-input:focus{outline:none;border-color:var(--primary);}

/* ===== SQUARE (KUADRAT) ===== */
.square-wrap{display:inline-grid; background:#fff; border-radius:18px; padding:16px; box-shadow:var(--shadow);}
.quad-row{display:flex;}
.quad-tl{display:flex;align-items:center;justify-content:center;}
.quad-strip{display:flex; gap:3px; border:2px dashed #C9C4B2; border-radius:8px; padding:4px; background:#FAFAF7; cursor:pointer;}
.quad-strip.tr{flex-direction:row; align-items:center;}
.quad-strip.bl{flex-direction:column; align-items:center;}
.quad-br{display:grid; gap:3px; border:2px dashed #C9C4B2; border-radius:8px; padding:4px; background:#FCFCFA;}
.quad-br .grid-cell{width:var(--u);height:var(--u);}

/* ===== QUIZ ===== */
.quiz-card{width:100%; max-width:560px; background:#fff; border-radius:20px; padding:24px; box-shadow:var(--shadow);}
.quiz-progress{font-size:.78rem;font-weight:800;color:var(--ink-soft);margin-bottom:10px;text-transform:uppercase;}
.quiz-q{font-size:1.08rem;font-weight:700;margin-bottom:18px;line-height:1.5;}
.quiz-opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;font-weight:700;font-size:.92rem;cursor:pointer;transition:all .15s;}
.quiz-opt:hover{border-color:var(--primary);}
.quiz-opt.correct{background:#E4F6EC;border-color:var(--success);color:var(--pos-dark);}
.quiz-opt.wrong{background:#FCEAEC;border-color:var(--danger);color:var(--neg-dark);}
.quiz-opt:disabled{cursor:default;}
.quiz-explain{font-size:.85rem;background:#EAF3FF;border-left:4px solid var(--primary);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:10px;line-height:1.5;}
.quiz-result{text-align:center;}
.quiz-score{font-size:3rem;font-weight:800;color:var(--primary-dark);margin:10px 0;}
.quiz-badge{font-size:3.4rem;}

/* ===== MODAL ===== */
.modal-overlay{position:fixed; inset:0; background:rgba(15,20,30,.65); display:none; align-items:center; justify-content:center; z-index:100; padding:16px; backdrop-filter:blur(3px);}
.modal-overlay.active{display:flex;}

<script>
/* ======================================================================
   Algebra Tiles : UBIN ALJABAR
   Media pembelajaran interaktif ubin aljabar (algebra tiles)
   Metode CRA (Konkret - Representasional - Abstrak)
   ====================================================================== */

/* ---------------------------------------------------------------------
   UTILITAS UMUM
--------------------------------------------------------------------- */
let _uidc = 1;
function uid(){ return 'id' + (_uidc++); }

function tileLabel(type, sign){
  if(type==='x2') return sign>0 ? 'x²' : '-x²';
  if(type==='x')  return sign>0 ? 'x'  : '-x';
  return sign>0 ? '+1' : '-1';
}

function makeTileEl(type, sign, {sz='board', horiz=false, cls='', locked=false} = {}){
  const div = document.createElement('div');
  div.className = `tile ${sign>0?'pos':'neg'} sz-${sz} t-${type} ${horiz?'horiz':''} ${cls}`.trim();
  if(locked) div.classList.add('locked');
  div.textContent = tileLabel(type, sign);
  return div;
}

// c = {x2,x,unit} -> "2x² - 3x + 4"
function formatExpr(c){
  const defs = [[c.x2||0,'x²'], [c.x||0,'x'], [c.unit||0,'']];
  let out = '';
  defs.forEach(([val,label])=>{
    if(val===0) return;
    const abs = Math.abs(val);
    const num = label ? (abs===1?'':String(abs)) : String(abs);
    const term = `${num}${label}`;
    if(out===''){ out = (val<0?'-':'') + term; }
    else{ out += (val<0?' - ':' + ') + term; }
  });
  return out || '0';
}

function compileTiles(arr){
  const c = {x2:0,x:0,unit:0};
  arr.forEach(t=>{ c[t.type] += t.sign; });
  return c;
}

// Hitung ubin per-jenis & per-tanda secara terpisah (untuk validasi langkah demi langkah)
function countTilesDetailed(arr){
  const c = {xPos:0,xNeg:0,unitPos:0,unitNeg:0};
  arr.forEach(t=>{
    if(t.type==='x'){ if(t.sign>0) c.xPos++; else c.xNeg++; }
    else if(t.type==='unit'){ if(t.sign>0) c.unitPos++; else c.unitNeg++; }
  });
  return c;
}

function toast(msg, ms=2200){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> el.classList.remove('show'), ms);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---------------------------------------------------------------------
   MODAL HELPERS
--------------------------------------------------------------------- */
function openModal(id){ document.getElementById(id).classList.add('active'); }
function closeModal(id){ document.getElementById(id).classList.remove('active'); }

/* ---------------------------------------------------------------------
   DRAG & DROP: memindahkan ubin dari Bank Ubin ke area kerja
   (Pakai Pointer Events agar berfungsi di mouse maupun layar sentuh)
--------------------------------------------------------------------- */
let dragInfo = null;      // {type, sign}
let dragGhostEl = null;
let dragSourceEl = null;
let dragHoverZone = null;

function enableBankDrag(slotEl, type, sign){
  // touch-action:none WAJIB di-set di sini (bukan hanya preventDefault saat
  // pointerdown), karena browser layar sentuh menentukan apakah sentuhan ini
  // akan di-scroll atau diserahkan ke JS BERDASARKAN CSS touch-action milik
  // elemen tersebut, sebelum event pointerdown sempat kita cegah.
  slotEl.style.touchAction = 'none';
  slotEl.style.webkitUserSelect = 'none';
  slotEl.style.userSelect = 'none';
  slotEl.addEventListener('pointerdown', (e)=>{
    if(e.pointerType==='mouse' && e.button !== 0) return;
    e.preventDefault();
    beginDrag(e, type, sign, slotEl);
  });
}

// Mengaktifkan drag untuk ubin yang SUDAH ADA di papan kerja (bukan menduplikasi dari bank),
// dipakai misalnya pada langkah "Bagi Rata" agar ubin bisa dipindah antar kelompok/kumpulan.
function enableInstanceDrag(tileEl, tileObj, sourceArr){
  tileEl.style.cursor = 'grab';
  // PERBAIKAN LAYAR SENTUH: tanpa touch-action:none, jari yang menyentuh ubin
  // ini akan ditangkap browser sebagai gestur scroll/zoom bawaan (warisan dari
  // aturan global `*{touch-action:manipulation}`), sehingga drag kustom di
  // bawah ini tidak pernah sempat berjalan di HP/tablet. Menonaktifkannya di
  // level elemen membuat drag ubin bekerja mulus di mouse MAUPUN sentuhan jari.
  tileEl.style.touchAction = 'none';
  tileEl.style.webkitUserSelect = 'none';
  tileEl.style.userSelect = 'none';
  tileEl.addEventListener('pointerdown', (e)=>{
    if(e.pointerType==='mouse' && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    beginDrag(e, tileObj.type, tileObj.sign, tileEl, {arr:sourceArr, id:tileObj.id});
  });
}

function beginDrag(e, type, sign, sourceEl, moveFrom=null){
  dragInfo = {type, sign, moveFrom};
  dragSourceEl = sourceEl;
  sourceEl.classList.add('selected');

  dragGhostEl = makeTileEl(type, sign, {sz:'board'});
  dragGhostEl.classList.add('drag-ghost');
  document.body.appendChild(dragGhostEl);
  moveGhost(e.clientX, e.clientY);

  document.querySelectorAll('.dropzone').forEach(z=> z.classList.add('dropzone-active'));

  const onMove = (ev)=>{ moveGhost(ev.clientX, ev.clientY); hoverAt(ev.clientX, ev.clientY); };
  const onUp = (ev)=>{
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
    dropAt(ev.clientX, ev.clientY);
  };
  const onCancel = ()=>{
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
    cancelDrag();
  };
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onCancel);
}

function moveGhost(x, y){
  if(dragGhostEl){ dragGhostEl.style.left = x+'px'; dragGhostEl.style.top = y+'px'; }
}

function hoverAt(x, y){
  const el = document.elementFromPoint(x, y);
  const zone = el ? el.closest('.dropzone') : null;
  if(zone !== dragHoverZone){
    if(dragHoverZone) dragHoverZone.classList.remove('dropzone-hover');
    dragHoverZone = zone;
    if(dragHoverZone) dragHoverZone.classList.add('dropzone-hover');
  }
}

function endDragVisuals(){
  document.querySelectorAll('.dropzone').forEach(z=> z.classList.remove('dropzone-active','dropzone-hover'));
  if(dragSourceEl) dragSourceEl.classList.remove('selected');
  if(dragGhostEl){ dragGhostEl.remove(); dragGhostEl = null; }
  dragHoverZone = null; dragSourceEl = null;
}

function dropAt(x, y){
  const el = document.elementFromPoint(x, y);
  const zone = el ? el.closest('.dropzone') : null;
  const info = dragInfo;
  endDragVisuals();
  dragInfo = null;
  if(zone && zone._onDrop && info){
    zone._onDrop(info.type, info.sign, info.moveFrom);
  } else if(info && !info.moveFrom){
    toast('Seret ubin ke area kerja untuk menaruhnya 👆');
  }
  // Jika info.moveFrom ada tapi tidak dilepas di dropzone manapun, ubin tetap di tempat asalnya (tidak hilang).
}

function cancelDrag(){
  endDragVisuals();
  dragInfo = null;
}

function showResultModal({icon='🎉', title, body, actionText='Lanjut', action, secondaryText, secondaryAction}){
  document.getElementById('resultIcon').textContent = icon;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultBody').innerHTML = body;
  const actBtn = document.getElementById('resultAction');
  actBtn.textContent = actionText;
  actBtn.onclick = ()=>{ closeModal('modalResult'); if(action) action(); };
  const secBtn = document.getElementById('resultSecondary');
  if(secondaryText){
    secBtn.style.display='inline-block'; secBtn.textContent = secondaryText;
    secBtn.onclick = ()=>{ closeModal('modalResult'); if(secondaryAction) secondaryAction(); };
  } else { secBtn.style.display='none'; }
  openModal('modalResult');
}

function showInfoModal(lvl){
  document.getElementById('infoBadge').textContent = lvl.badge || 'Misi';
  document.getElementById('infoTitle').textContent = lvl.title;
  document.getElementById('infoBody').innerHTML = lvl.desc;
  const hint = document.getElementById('infoHint');
  if(lvl.hint){ hint.style.display='block'; hint.innerHTML = '💡 <b>Petunjuk:</b> ' + lvl.hint; }
  else{ hint.style.display='none'; }
  openModal('modalInfo');
}

/* ---------------------------------------------------------------------
   DATA KURIKULUM (9 MODUL BERURUTAN)
--------------------------------------------------------------------- */
const MODULES = [
  {

    title:'Mengenal Ubin Aljabar',
    shortDesc:'Kenali bentuk & makna setiap ubin: satuan, x, dan x².',

/* ---------------------------------------------------------------------
   STATE NAVIGASI GLOBAL
--------------------------------------------------------------------- */
let currentModuleId = null;
let selectedTile = null; // {type,sign}
let appMode = null; // 'sequential' | 'explore'

function currentModule(){ return MODULES.find(m=>m.id===currentModuleId); }
function isUnlocked(m){
  if(appMode==='explore') return true;
  const idx = MODULES.indexOf(m);
  if(idx===0) return true;
  return MODULES[idx-1].completed;
}

function overallProgressPct(){
  const done = MODULES.filter(m=>m.completed).length;
  return Math.round((done / MODULES.length) * 100);
}

/* ---------------------------------------------------------------------
   HOME SCREEN
--------------------------------------------------------------------- */
function renderHome(){
  const wrap = document.getElementById('homeWrap');
  const pct = overallProgressPct();
  const anyDone = MODULES.some(m=>m.completed);

  let html = `
    <div class="hero">
      <h1>🧩 Algebra Tiles: Ubin Aljabar</h1>
      <p>Belajar konsep aljabar secara <b>konkret</b> lewat ubin, lalu bertahap menuju <b>gambar</b> dan <b>simbol abstrak</b> — dengan cara yang menyenangkan seperti bermain!</p>
      <div class="hero-actions">
        <button class="btn btn-primary" id="btnStart">${anyDone? 'Lanjutkan Belajar ▶️' : 'Mulai Belajar 🚀'}</button>
        <button class="btn btn-ghost" id="btnGuideHome">📖 Cara Bermain</button>
        <button class="btn btn-ghost" id="btnChangeMode">🔀 Ubah Mode</button>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div style="font-size:.78rem;color:var(--ink-soft);margin-top:6px;font-weight:700;">Progres belajar: ${pct}% &nbsp;•&nbsp; Mode: <b>${appMode==='explore'?'Eksplorasi 🗺️':'Berurutan 🔒'}</b></div>
      <div class="legend-row">
        <div class="legend-item"><span class="legend-swatch" style="background:var(--pos);"></span> Positif</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--neg);"></span> Negatif</div>
        <div class="legend-item">▮ = 1 &nbsp; ▯ = x &nbsp; ⬛ = x²</div>
      </div>
    </div>
    <div class="path" id="pathList"></div>
  `;
  wrap.innerHTML = html;

  const list = document.getElementById('pathList');
  MODULES.forEach((m, i)=>{
    const unlocked = isUnlocked(m);
    const status = m.completed ? 'done' : (unlocked ? 'unlocked' : 'locked');
    const node = document.createElement('div');
    node.className = `node ${status}`;
    node.innerHTML = `
      <div class="node-badge">${m.completed? '✅' : m.icon}</div>
      <div class="node-card">
        <div class="node-title">${i+1}. ${m.title}</div>
        <div class="node-desc">${m.shortDesc}</div>
        <span class="node-status ${status}">${status==='done'?'Selesai':status==='unlocked'?'Terbuka':'Terkunci'}</span>
      </div>
    `;
    node.addEventListener('click', ()=>{
      if(!unlocked){ toast('🔒 Selesaikan modul sebelumnya dulu, ya!'); return; }
      openModule(m.id);
    });
    list.appendChild(node);
  });

  document.getElementById('btnStart').addEventListener('click', ()=>{
    const next = MODULES.find(m=>!m.completed) || MODULES[0];
    openModule(next.id);
  });
  document.getElementById('btnGuideHome').addEventListener('click', ()=> openGuide());
  document.getElementById('btnChangeMode').addEventListener('click', ()=> showModeSelect());
}

function selectMode(mode){
  const isFirstTime = appMode===null;
  appMode = mode;
  toast(mode==='explore' ? '🗺️ Mode Eksplorasi aktif — semua modul terbuka!' : '🧗 Mode Berurutan aktif.');
  goHome();
  if(isFirstTime) setTimeout(openGuide, 350);
}

/* ---------------------------------------------------------------------
   SCREEN NAVIGATION
--------------------------------------------------------------------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome(){
  currentModuleId = null;
  document.getElementById('brandText').innerHTML = 'Algebra Tiles <small>Ubin Aljabar</small>';
  document.getElementById('levelPill').style.display = 'none';
  document.getElementById('btnMissionMobile').style.display = 'none';
  renderHome();
  showScreen('screen-home');
}

function openModule(id){
  currentModuleId = id;
  const m = currentModule();
  document.getElementById('brandText').innerHTML = `${m.icon} <small>${m.title}</small>`;
  document.getElementById('levelPill').style.display = 'inline-block';
  document.getElementById('btnMissionMobile').style.display = (m.kind==='quiz') ? 'none' : 'flex';
  showScreen('screen-module');
  loadLevel();
}

function loadLevel(){
  const m = currentModule();
  const bankPanel = document.getElementById('bankPanel');
  bankPanel.style.display = (m.kind==='quiz') ? 'none' : 'flex';

  if(m.kind==='quiz'){
    document.getElementById('levelPill').textContent = 'Evaluasi';
    QuizEngine.start(m);
    return;
  }

  const lvl = m.levels[m.progressLevel];
  document.getElementById('levelPill').textContent = `Level ${m.progressLevel+1} / ${m.levels.length}`;

  if(m.kind==='freeboard') FreeboardEngine.start(m, lvl);
  else if(m.kind==='area') AreaEngine.start(m, lvl);
  else if(m.kind==='scale') ScaleEngine.start(m, lvl);
  else if(m.kind==='square') SquareEngine.start(m, lvl);

  showInfoModal(lvl);
}

function nextLevelOrComplete(m){
  if(m.progressLevel < m.levels.length - 1){
    m.progressLevel++;
    loadLevel();
  } else {
    m.completed = true;
    const idx = MODULES.indexOf(m);
    const isLast = idx === MODULES.length - 1;
    showResultModal({
      icon:'🏅', title:'Modul Selesai!',
      body:`Kerja bagus! Kamu telah menyelesaikan modul <b>${m.title}</b>.` + (isLast? '' : ' Modul berikutnya kini terbuka.'),
      actionText: isLast ? 'Kembali ke Peta Belajar' : 'Ke Peta Belajar ▶️',
      action: ()=> goHome()
    });
  }
}

/* ---------------------------------------------------------------------
   BANK RENDER HELPER (dipakai freeboard, area, square)
--------------------------------------------------------------------- */
function renderBankSelector(container, options){
  // options: {types: ['x2','x','unit'], allowNeg: bool, note: string}
  container.innerHTML = '';
  container.style.flexDirection = window.innerWidth<=880 ? 'row' : 'column';

  const title = document.createElement('h3');
  title.textContent = 'Bank Ubin';
  container.appendChild(title);

  const group = document.createElement('div');
  group.className = 'bank-group';
  const row = document.createElement('div');
  row.className = 'bank-row';
  group.appendChild(row);
  container.appendChild(group);

  function addSlot(type, sign){
    const slot = document.createElement('div');
    slot.className = 'bank-slot';
    slot.dataset.type = type; slot.dataset.sign = sign;
    const t = makeTileEl(type, sign, {sz:'bank'});
    const lbl = document.createElement('div');
    lbl.className = 'lbl';
    lbl.textContent = tileLabel(type, sign);
    slot.appendChild(t); slot.appendChild(lbl);
    enableBankDrag(slot, type, sign);
    row.appendChild(slot);
  }

  options.types.forEach(type=> addSlot(type, 1));
  if(options.allowNeg){
    options.types.forEach(type=> addSlot(type, -1));
  }

  const legend = document.createElement('div');
  legend.className = 'legend-mini';
  legend.innerHTML = `<b>Ingat:</b> Hijau = positif, Merah = negatif.<br><b>Seret (drag)</b> ubin di atas ke area kerja untuk menaruhnya. Ketuk ubin yang sudah ditaruh untuk menghapusnya.`;
  container.appendChild(legend);
}
