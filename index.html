/* ---------------------------------------------------------------------
   FULLSCREEN
--------------------------------------------------------------------- */
function isFullscreenActive(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
function toggleFullscreen(){
  if(!isFullscreenActive()){
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(req) req.call(el);
    else toast('Layar penuh tidak didukung di perangkat ini.');
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(exit) exit.call(document);
  }
}
function updateFullscreenIcon(){
  const btn = document.getElementById('btnFullscreen');
  if(!btn) return;
  const active = isFullscreenActive();
  btn.textContent = active ? '⤢' : '⛶';
  btn.title = active ? 'Keluar Layar Penuh' : 'Layar Penuh';
}

/* =======================================================================
   ENGINE: FREEBOARD (Modul 1-4)
   ======================================================================= */
const FreeboardEngine = {
  tiles: [],
  start(m, lvl){
    this.m = m; this.lvl = lvl; this.tiles = [];
    selectedTile = null;

    renderBankSelector(document.getElementById('bankPanel'), {
      types: lvl.allowTypes || ['x2','x','unit'],
      allowNeg: !!lvl.allowNeg
    });

    this.renderWork();
    this.renderStatus();
  },
  renderWork(){
    const work = document.getElementById('workArea');
    work.innerHTML = '';
    const board = document.createElement('div');
    board.className = 'freeboard-area dropzone' + (this.tiles.length===0 ? ' empty' : '');
    board._onDrop = (type, sign)=>{
      this.tiles.push({id:uid(), type, sign});
      this.renderWork();
    };
    this.tiles.forEach(t=>{
      const el = makeTileEl(t.type, t.sign, {sz:'board', cls:'pop-in'});
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        this.tiles = this.tiles.filter(x=>x.id!==t.id);
        this.renderWork(); this.updateExprPill();
      });
      board.appendChild(el);
    });
    work.appendChild(board);
    this.updateExprPill();
    this.syncExprText();
  },
  updateExprPill(){
    document.getElementById('exprPill').textContent = formatExpr(compileTiles(this.tiles));
  },
  renderStatus(){
    const panel = document.getElementById('statusPanel');
    const lvl = this.lvl;
    panel.innerHTML = `
      <div class="mission-card">
        <div class="mission-badge">${lvl.badge||'Misi'}</div>
        <div class="mission-title">${lvl.title}</div>
        <div class="mission-desc">${lvl.desc}</div>
        ${lvl.hint? `<div class="mission-hint">💡 <b>Petunjuk:</b> ${lvl.hint}</div>` : ''}
      </div>
      <div class="status-box">
        <div class="status-label">Bentuk Aljabar Saat Ini</div>
        <div class="status-val" id="statusExpr">0</div>
      </div>
      <div class="status-actions">
        ${lvl.allowGroup? '<button class="btn btn-accent btn-block" id="btnGroup">🗂️ Kelompokkan</button>' : ''}
        ${lvl.allowSimplify? '<button class="btn btn-accent btn-block" id="btnSimplify">💥 Hilangkan Pasangan Nol</button>' : ''}
        <button class="btn btn-primary btn-block" id="btnCheck">✅ Cek Jawaban</button>
        <button class="btn btn-clear btn-block" id="btnClear">🗑️ Bersihkan</button>
      </div>
    `;
    this.syncExprText();
    if(lvl.allowGroup) document.getElementById('btnGroup').addEventListener('click', ()=> this.group());
    if(lvl.allowSimplify) document.getElementById('btnSimplify').addEventListener('click', ()=> this.simplify());
    document.getElementById('btnCheck').addEventListener('click', ()=> this.check());
    document.getElementById('btnClear').addEventListener('click', ()=>{ this.tiles=[]; this.renderWork(); });
  },
  syncExprText(){
    const el = document.getElementById('statusExpr');
    if(el) el.textContent = formatExpr(compileTiles(this.tiles));
  },
  group(){
    const order = {x2:0, x:1, unit:2};
    this.tiles.sort((a,b)=> (order[a.type]-order[b.type]) || (b.sign-a.sign));
    this.renderWork();
    toast('🗂️ Ubin sejenis sudah dikelompokkan!');
  },
  simplify(){
    let removed = false;
    const toRemove = new Set();
    ['x2','x','unit'].forEach(type=>{
      const pos = this.tiles.filter(t=>t.type===type && t.sign>0);
      const neg = this.tiles.filter(t=>t.type===type && t.sign<0);
      const n = Math.min(pos.length, neg.length);
      for(let i=0;i<n;i++){
        removed = true;
        toRemove.add(pos[i].id);
        toRemove.add(neg[i].id);
      }
    });
    if(!removed){ toast('Tidak ada pasangan nol yang bisa dihilangkan.'); return; }

    // Mainkan animasi "meledak/menghilang" (sama seperti di Timbangan) pada ubin
    // yang akan dibuang, sebelum benar-benar dihapus dari state, supaya efeknya
    // konsisten & selalu terlihat di setiap aktivitas yang punya tombol ini.
    const boardEl = document.querySelector('.freeboard-area');
    const domTiles = boardEl ? [...boardEl.children] : [];
    this.tiles.forEach((t, i)=>{
      if(toRemove.has(t.id) && domTiles[i]) domTiles[i].classList.add('zero-pair-anim');
    });
    // Nonaktifkan tombol sementara supaya animasi tidak terpotong oleh klik ganda.
    const btn = document.getElementById('btnSimplify');
    if(btn) btn.disabled = true;
    toast('💥 Pasangan nol dihilangkan!');
    setTimeout(()=>{
      this.tiles = this.tiles.filter(t=> !toRemove.has(t.id));
      this.renderWork();
    }, 620);
  },
  check(){
    const lvl = this.lvl;
    if(lvl.requireSimplifyClick){
      const stillHasPair = ['x2','x','unit'].some(type=>{
        const pos = this.tiles.some(t=>t.type===type && t.sign>0);
        const neg = this.tiles.some(t=>t.type===type && t.sign<0);
        return pos && neg;
      });
      if(stillHasPair){
        showResultModal({icon:'💡', title:'Hampir Sampai!', body:'Susunan ubinmu sudah benar. Sekarang tekan tombol <b>"Hilangkan Pasangan Nol"</b> dulu untuk menyederhanakannya.', actionText:'Oke, Mengerti'});
        return;
      }
    }
    const c = compileTiles(this.tiles);
    const t = lvl.target;
    if(c.x2===t.x2 && c.x===t.x && c.unit===t.unit){
      showResultModal({
        icon:'🎉', title:'Luar Biasa!',
        body:`Kamu berhasil menyusun bentuk <b>${formatExpr(t)}</b> dengan tepat!`,
        actionText:'Lanjut ▶️',
        action: ()=> nextLevelOrComplete(this.m)
      });
    } else {
      showResultModal({
        icon:'🤔', title:'Belum Tepat',
        body:`Target misi ini adalah <b>${formatExpr(t)}</b>.<br>Susunanmu saat ini: <b>${formatExpr(c)}</b>. Periksa kembali jumlah dan tanda ubinmu.`,
        actionText:'Coba Lagi'
      });
    }
  }
};

/* =======================================================================
   ENGINE: AREA MODEL (Modul Perkalian & Faktorisasi)
   ======================================================================= */
const AreaEngine = {
  start(m, lvl){
    this.m = m; this.lvl = lvl;
    this.top = []; this.left = []; this.product = {};
    selectedTile = null;

    renderBankSelector(document.getElementById('bankPanel'), { types:['x2','x','unit'], allowNeg:true });
    this.renderWork();
    this.renderStatus();
  },
  cellsFilled(){ return Object.keys(this.product).length; },
  totalCells(){ return this.top.length * this.left.length; },
  expectedCell(i,j){
    const top = this.top[j], left = this.left[i];
    let type;
    if(top.type==='x' && left.type==='x') type='x2';
    else if(top.type==='unit' && left.type==='unit') type='unit';
    else type='x';
    return { type, sign: top.sign*left.sign };
  },
  renderWork(){
    const work = document.getElementById('workArea');
    work.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'area-wrap';

    const corner = document.createElement('div'); corner.className='corner';
    const topZone = document.createElement('div'); topZone.className='zone top';
    const leftZone = document.createElement('div'); leftZone.className='zone left';
    const grid = document.createElement('div'); grid.className='grid-wrap';

    // top factor tiles
    this.top.forEach((t, idx)=>{
      const el = makeTileEl(t.type, t.sign, {sz:'board', horiz:(t.type==='x'), cls:'pop-in'});
      el.addEventListener('click', (e)=>{ e.stopPropagation(); this.top.splice(idx,1); this.product={}; this.renderWork(); });
      topZone.appendChild(el);
    });
    topZone.classList.add('dropzone');
    topZone._onDrop = (type, sign)=>{
      if(type==='x2'){ toast('Ubin x² hanya untuk mengisi kotak hasil kali, bukan faktor di tepi.'); return; }
      this.top.push({type, sign});
      this.product = {};
      this.renderWork();
    };

    // left factor tiles
    this.left.forEach((t, idx)=>{
      const el = makeTileEl(t.type, t.sign, {sz:'board', cls:'pop-in'});
      el.addEventListener('click', (e)=>{ e.stopPropagation(); this.left.splice(idx,1); this.product={}; this.renderWork(); });
      leftZone.appendChild(el);
    });
    leftZone.classList.add('dropzone');
    leftZone._onDrop = (type, sign)=>{
      if(type==='x2'){ toast('Ubin x² hanya untuk mengisi kotak hasil kali, bukan faktor di tepi.'); return; }
      this.left.push({type, sign});
      this.product = {};
      this.renderWork();
    };

    // product grid
    if(this.top.length===0 || this.left.length===0){
      grid.innerHTML = '<div class="grid-placeholder">Susun faktor Atas & Kiri dulu untuk membuka area hasil kali.</div>';
      grid.style.width = 'calc(var(--u) * 3)'; grid.style.height = 'calc(var(--u) * 3)';
    } else {
      const colSizes = this.top.map(t=> t.type==='x' ? 'var(--len)' : 'var(--u)');
      const rowSizes = this.left.map(t=> t.type==='x' ? 'var(--len)' : 'var(--u)');
      grid.style.gridTemplateColumns = colSizes.join(' ');
      grid.style.gridTemplateRows = rowSizes.join(' ');
      for(let i=0;i<this.left.length;i++){
        for(let j=0;j<this.top.length;j++){
          const key = `${i}-${j}`;
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          if(this.product[key]){
            const pt = this.product[key];
            const tEl = makeTileEl(pt.type, pt.sign, {sz:'board', horiz:false, cls:'pop-in'});
            tEl.style.width='100%'; tEl.style.height='100%';
            tEl.addEventListener('click', (e)=>{ e.stopPropagation(); delete this.product[key]; this.renderWork(); });
            cell.appendChild(tEl);
          } else {
            cell.classList.add('dropzone');
            cell._onDrop = (type, sign)=>{
              this.product[key] = {type, sign};
              this.renderWork();
            };
          }
          grid.appendChild(cell);
        }
      }
    }

    wrap.appendChild(corner); wrap.appendChild(topZone);
    wrap.appendChild(leftZone); wrap.appendChild(grid);
    work.appendChild(wrap);
    this.updateExprPill();
    this.syncExprText();
  },
  updateExprPill(){
    const top = formatExpr(compileTiles(this.top));
    document.getElementById('exprPill').textContent = `(${this.top.length? top:'0'}) × (${this.left.length? formatExpr(compileTiles(this.left)):'0'})`;
  },
  renderStatus(){
    const panel = document.getElementById('statusPanel');
    const lvl = this.lvl;
    panel.innerHTML = `
      <div class="mission-card">
        <div class="mission-badge">${lvl.badge||'Misi'}</div>
        <div class="mission-title">${lvl.title}</div>
        <div class="mission-desc">${lvl.desc}</div>
        ${lvl.hint? `<div class="mission-hint">💡 <b>Petunjuk:</b> ${lvl.hint}</div>` : ''}
      </div>
      <div class="status-box">
        <div class="status-label">Model Saat Ini</div>
        <div class="status-val" id="statusExpr" style="font-size:.95rem;"></div>
      </div>
      <div class="status-actions">
        <button class="btn btn-primary btn-block" id="btnCheck">✅ Cek Jawaban</button>
        <button class="btn btn-clear btn-block" id="btnClear">🗑️ Bersihkan</button>
      </div>
    `;
    this.syncExprText();
    document.getElementById('btnCheck').addEventListener('click', ()=> this.check());
    document.getElementById('btnClear').addEventListener('click', ()=>{ this.top=[]; this.left=[]; this.product={}; this.renderWork(); });
  },
  syncExprText(){
    const el = document.getElementById('statusExpr');
    if(!el) return;
    const top = this.top.length? formatExpr(compileTiles(this.top)) : '0';
    const left = this.left.length? formatExpr(compileTiles(this.left)) : '0';
    const prod = this.cellsFilled()? formatExpr(compileTiles(Object.values(this.product))) : '0';
    el.innerHTML = `(${top}) × (${left})<br>= ${prod}`;
  },
  check(){
    const lvl = this.lvl;
    if(this.top.length===0 || this.left.length===0){
      showResultModal({icon:'🤔', title:'Belum Lengkap', body:'Susun dulu faktor di sisi atas dan kiri.', actionText:'Oke'}); return;
    }
    if(this.cellsFilled() < this.totalCells()){
      showResultModal({icon:'🤔', title:'Belum Lengkap', body:'Masih ada kotak kosong di area hasil kali yang belum diisi ubin.', actionText:'Oke'}); return;
    }
    let allCorrect = true;
    for(let i=0;i<this.left.length;i++){
      for(let j=0;j<this.top.length;j++){
        const exp = this.expectedCell(i,j);
        const act = this.product[`${i}-${j}`];
        if(!act || act.type!==exp.type || act.sign!==exp.sign) allCorrect = false;
      }
    }
    if(!allCorrect){
      showResultModal({icon:'🤔', title:'Ada yang Kurang Tepat', body:'Periksa kembali hukum tanda (+ / -) dan jenis ubin pada setiap kotak.', actionText:'Coba Lagi'});
      return;
    }
    if(this.m.mode==='build'){
      const tc = compileTiles(this.top), lc = compileTiles(this.left);
      const okNormal = tc.x===lvl.targetTop.x && tc.unit===lvl.targetTop.unit && lc.x===lvl.targetLeft.x && lc.unit===lvl.targetLeft.unit;
      const okSwap = tc.x===lvl.targetLeft.x && tc.unit===lvl.targetLeft.unit && lc.x===lvl.targetTop.x && lc.unit===lvl.targetTop.unit;
      if(!okNormal && !okSwap){
        showResultModal({icon:'🤔', title:'Faktor Belum Sesuai', body:'Kotak hasil kali sudah benar, tapi faktor di tepi belum sesuai dengan misi. Periksa kembali soalnya.', actionText:'Coba Lagi'});
        return;
      }
      showResultModal({icon:'🎉', title:'Perkalian Berhasil!', body:'Kamu berhasil memodelkan perkalian aljabar dengan tepat menggunakan Model Luas!', actionText:'Lanjut ▶️', action:()=>nextLevelOrComplete(this.m)});
    } else {
      const total = compileTiles(Object.values(this.product));
      const tp = lvl.targetProduct;
      if(total.x2===tp.x2 && total.x===tp.x && total.unit===tp.unit){
        const topStr = formatExpr(compileTiles(this.top)), leftStr = formatExpr(compileTiles(this.left));
        showResultModal({icon:'🎉', title:'Faktor Ditemukan!', body:`Kamu berhasil menemukan faktornya: <b>(${topStr}) × (${leftStr})</b> = ${formatExpr(tp)}`, actionText:'Lanjut ▶️', action:()=>nextLevelOrComplete(this.m)});
      } else {
        showResultModal({icon:'🤔', title:'Belum Sesuai Target', body:`Total hasil kalimu adalah <b>${formatExpr(total)}</b>, sedangkan target misi adalah <b>${formatExpr(tp)}</b>. Coba ubah faktor di tepi atas/kiri.`, actionText:'Coba Lagi'});
      }
    }
  }
};

/* =======================================================================
   ENGINE: SCALE (Modul PLSV / Timbangan)
   ======================================================================= */
const ScaleEngine = {
  start(m, lvl){
    this.m = m; this.lvl = lvl;
    this.left = lvl.initial.left.map(t=>({...t,id:uid()}));
    this.right = lvl.initial.right.map(t=>({...t,id:uid()}));
    // Nilai aljabar AWAL tiap sisi (snapshot saat level dimulai). Karena soal
    // yang diberikan (mis. "3x - 2 = 7") SECARA DEFINISI kedua sisinya sudah
    // setara, timbangan harus tampil RATA di kondisi awal ini. Snapshot ini
    // lah acuan "seimbang" -> lihat computeTilt().
    this.l0 = compileTiles(this.left);
    this.r0 = compileTiles(this.right);
    this.d0 = this.diff();
    this.stepIndex = 0;
    // Reset status "bangunan" timbangan & state langkah bagi-rata setiap kali level dimulai/diulang
    this._built = false;
    this.dividePool = null;
    this.divideGroups = null;
    selectedTile = null;

    renderBankSelector(document.getElementById('bankPanel'), { types:['x','unit'], allowNeg:true });
    this.renderWork();
    this.renderStatus();
  },
  currentStep(){ return this.lvl.steps[this.stepIndex]; },
  diff(){
    const l = compileTiles(this.left), r = compileTiles(this.right);
    return { x: l.x - r.x, unit: l.unit - r.unit };
  },
  // Hitung SELISIH nilai aljabar tiap sisi dibanding kondisi AWALnya sendiri
  // (bukan nilai absolut sisi kiri vs kanan secara langsung). Ini penting:
  // karena soalnya sudah berupa PERSAMAAN (mis. 3x - 2 = 7), kedua sisi
  // MEMANG bernilai setara sejak awal -> timbangan harus rata di kondisi
  // awal. Ia hanya boleh miring saat satu sisi berubah (ubin ditambah/
  // dikurangi) sementara sisi lain belum "dicerminkan" dengan perubahan
  // yang sama -> itulah sinyal "kamu belum menyeimbangkan operasimu".
  // Pasangan nol yang dihilangkan tidak mengubah nilai (sudah netral sejak
  // digabung), jadi tidak memengaruhi kemiringan sama sekali.
  algebraicDelta(arr, base){
    const c = compileTiles(arr);
    return (c.x2||0)-(base.x2||0) + (c.x||0)-(base.x||0) + (c.unit||0)-(base.unit||0);
  },
  computeTilt(){
    const deltaLeft = this.algebraicDelta(this.left, this.l0);
    const deltaRight = this.algebraicDelta(this.right, this.r0);
    const diff = deltaRight - deltaLeft; // + => sisi kanan mendapat "tambahan" lebih banyak -> lebih berat
    const deg = Math.max(-13, Math.min(13, diff * 2.6));
    return deg;
  },
  // ------------------------------------------------------------------
  // PERBAIKAN UTAMA: sebelumnya seluruh rig timbangan (beam-bar, pan-col,
  // dst) dibuat ULANG dari nol (document.createElement) setiap kali ada
  // perubahan ubin. Akibatnya CSS transition pada .beam-bar/.pan-col
  // tidak pernah berjalan (elemen baru tidak punya "nilai transform lama"
  // untuk dianimasikan dari situ) -> timbangan terlihat "meloncat/patah",
  // bukan bergerak naik-turun secara halus.
  // Solusinya: bangun rig HANYA SEKALI (buildRig), lalu untuk perubahan
  // berikutnya cukup panggil updateWork() yang mengubah isi & style pada
  // elemen yang SAMA, sehingga transition benar-benar teranimasi.
  // ------------------------------------------------------------------
  renderWork(){
    const work = document.getElementById('workArea');
    const step = this.currentStep();
    if(step.action === 'divide'){
      this._built = false; // rig timbangan biasa perlu dibangun ulang saat kembali dari mode bagi-rata
      this.renderDivideWork(work);
      return;
    }
    if(!this._built){
      this.buildRig(work);
    }
    this.updateWork();
  },
  buildRig(work){
    work.innerHTML = '';
    const wrap = document.createElement('div'); wrap.className='scale-wrap';
    const eq = document.createElement('div'); eq.className='eq-display';
    const dots = document.createElement('div'); dots.className='step-progress';

    const rig = document.createElement('div'); rig.className='scale-rig';
    const pivotStand = document.createElement('div'); pivotStand.className='pivot-stand';
    const pivotCap = document.createElement('div'); pivotCap.className='pivot-cap';
    const beamBar = document.createElement('div'); beamBar.className='beam-bar';
    const panRow = document.createElement('div'); panRow.className='pan-row';

    const makeCol = ()=>{
      const col = document.createElement('div'); col.className='pan-col';
      const chain = document.createElement('div'); chain.className='chain';
      const lbl = document.createElement('div'); lbl.className='pan-label';
      const pan = document.createElement('div'); pan.className='pan dropzone';
      col.appendChild(chain); col.appendChild(lbl); col.appendChild(pan);
      return {col, lbl, pan};
    };
    const L = makeCol(), R = makeCol();
    L.lbl.textContent = 'Sisi Kiri';
    R.lbl.textContent = 'Sisi Kanan';
    L.pan._onDrop = (type, sign)=>{ this.left.push({type, sign, id:uid()}); this.updateWork(); };
    R.pan._onDrop = (type, sign)=>{ this.right.push({type, sign, id:uid()}); this.updateWork(); };

    panRow.appendChild(L.col); panRow.appendChild(R.col);
    rig.appendChild(pivotStand); rig.appendChild(pivotCap); rig.appendChild(beamBar); rig.appendChild(panRow);

    const tiltHint = document.createElement('div'); tiltHint.className='tilt-hint';
    tiltHint.textContent = '⚖️ Perubahan ubin di kedua sisi belum sama — timbangan miring sementara.';

    wrap.appendChild(eq); wrap.appendChild(dots); wrap.appendChild(rig); wrap.appendChild(tiltHint);
    work.appendChild(wrap);

    this.elWrap = wrap; this.elEq = eq; this.elDots = dots; this.elBeam = beamBar;
    this.elLeftCol = L.col; this.elLeftLabel = L.lbl; this.elLeftPan = L.pan;
    this.elRightCol = R.col; this.elRightLabel = R.lbl; this.elRightPan = R.pan;
    this.elTiltHint = tiltHint;
    this._built = true;
  },
  // Mengisi ulang konten (bukan membangun ulang bingkai) supaya transisi CSS tetap berjalan.
  updateWork(){
    this.elEq.textContent = this.lvl.eq;

    this.elDots.innerHTML = '';
    this.lvl.steps.forEach((s,i)=>{
      const d = document.createElement('div');
      d.className = 'step-dot' + (i<this.stepIndex? ' done' : (i===this.stepIndex? ' now':''));
      this.elDots.appendChild(d);
    });

    const fillPan = (panEl, arr)=>{
      panEl.innerHTML = '';
      arr.forEach(t=>{
        const el = makeTileEl(t.type, t.sign, {sz:'board', cls:'pop-in'});
        el.dataset.id = t.id;
        el.addEventListener('click', (e)=>{
          e.stopPropagation();
          const i = arr.findIndex(x=>x.id===t.id);
          if(i>-1) arr.splice(i,1);
          this.updateWork();
        });
        panEl.appendChild(el);
      });
    };
    fillPan(this.elLeftPan, this.left);
    fillPan(this.elRightPan, this.right);

    const deltaLeft = this.algebraicDelta(this.left, this.l0);
    const deltaRight = this.algebraicDelta(this.right, this.r0);
    const leftHeavier = deltaLeft > deltaRight;
    const rightHeavier = deltaRight > deltaLeft;
    this.elLeftPan.classList.toggle('tip-heavy', leftHeavier);
    this.elRightPan.classList.toggle('tip-heavy', rightHeavier);
    this.elLeftLabel.textContent = 'Sisi Kiri' + (leftHeavier? ' ⬇️' : '');
    this.elRightLabel.textContent = 'Sisi Kanan' + (rightHeavier? ' ⬇️' : '');

    const tiltDeg = this.computeTilt();
    const tiltRad = tiltDeg * Math.PI/180;
    const armPx = 46; // jarak vertikal maksimum pergerakan piringan
    const leftY = -Math.sin(tiltRad) * armPx;   // kanan berat -> kiri naik (negatif)
    const rightY = Math.sin(tiltRad) * armPx;   // kanan berat -> kanan turun (positif)

    // Karena elBeam & elLeftCol/elRightCol adalah elemen YANG SAMA di setiap
    // pemanggilan (bukan elemen baru), CSS transition pada properti transform
    // ini benar-benar teranimasi -> efek naik-turun terlihat halus.
    this.elBeam.style.transform = `rotate(${tiltDeg}deg)`;
    this.elLeftCol.style.transform = `translateY(${leftY}px)`;
    this.elRightCol.style.transform = `translateY(${rightY}px)`;

    this.elTiltHint.style.display = (deltaLeft !== deltaRight) ? '' : 'none';

    this.updateExprPill();
    this.syncExprText();
  },
  updateExprPill(){
    document.getElementById('exprPill').textContent = `${formatExpr(compileTiles(this.left))}  =  ${formatExpr(compileTiles(this.right))}`;
  },
  renderStatus(){
    const panel = document.getElementById('statusPanel');
    const lvl = this.lvl;
    const step = this.currentStep();
    const total = lvl.steps.length;
    panel.innerHTML = `
      <div class="mission-card">
        <div class="mission-badge">${lvl.badge||'Misi'} · Langkah ${this.stepIndex+1}/${total}</div>
        <div class="mission-title">${lvl.title}</div>
        <div class="mission-desc">${step.desc}</div>
        ${step.hint? `<div class="mission-hint">💡 <b>Petunjuk:</b> ${step.hint}</div>` : ''}
      </div>
      <div class="status-box">
        <div class="status-label">Persamaan Saat Ini</div>
        <div class="status-val" id="statusExpr" style="font-size:.95rem;"></div>
      </div>
      ${step.action==='divide' ? `
      <div class="status-box">
        <div class="status-label">Nilai x yang kamu temukan</div>
        <div class="divide-input-row">
          <span class="xlbl">x =</span>
          <input type="number" step="1" class="divide-input" id="divideXInput" placeholder="?">
        </div>
      </div>` : ''}
      <div class="status-actions">
        ${step.action==='check' ? `<button class="btn btn-primary btn-block" id="btnStepCheck">✅ Cek Langkah</button>` : ''}
        ${step.action==='zero' ? `<button class="btn btn-accent btn-block" id="btnZero">💥 Hilangkan Pasangan Nol</button>` : ''}
        ${step.action==='divide' ? `<button class="btn btn-primary btn-block" id="btnDivideCheck">✅ Cek Jawaban</button>` : ''}
        <button class="btn btn-clear btn-block" id="btnReset">↩️ Ulangi dari Awal</button>
      </div>
    `;
    this.syncExprText();
    if(step.action==='check') document.getElementById('btnStepCheck').addEventListener('click', ()=> this.checkStep());
    if(step.action==='zero') document.getElementById('btnZero').addEventListener('click', ()=> this.zeroPair());
    if(step.action==='divide') document.getElementById('btnDivideCheck').addEventListener('click', ()=> this.checkDivide());
    document.getElementById('btnReset').addEventListener('click', ()=>{ clearTapSelection(); this.start(this.m, this.lvl); });
  },
  syncExprText(){
    const el = document.getElementById('statusExpr');
    if(el) el.innerHTML = `${formatExpr(compileTiles(this.left))}<br>=<br>${formatExpr(compileTiles(this.right))}`;
  },
  advanceStep(){
    if(this.stepIndex < this.lvl.steps.length - 1){
      this.stepIndex++;
      this.renderWork();
      this.renderStatus();
      toast('👍 Langkah selesai! Lanjut ke langkah berikutnya.');
    }
  },
  checkStep(){
    const step = this.currentStep();
    const lc = countTilesDetailed(this.left), rc = countTilesDetailed(this.right);
    const tl = step.target.left, tr = step.target.right;
    const ok = lc.xPos===tl.xPos && lc.xNeg===tl.xNeg && lc.unitPos===tl.unitPos && lc.unitNeg===tl.unitNeg &&
               rc.xPos===tr.xPos && rc.xNeg===tr.xNeg && rc.unitPos===tr.unitPos && rc.unitNeg===tr.unitNeg;
    if(!ok){
      showResultModal({icon:'🤔', title:'Belum Tepat', body:'Susunan ubin di timbangan belum sesuai instruksi langkah ini. Perhatikan jumlah ubin positif dan negatif di kedua sisi, lalu coba lagi.', actionText:'Coba Lagi'});
      return;
    }
    this.advanceStep();
  },
  // Mencari pasangan +1/-1 (per jenis ubin) TANPA langsung menghapusnya dari array,
  // supaya animasi "vanish" bisa dimainkan dulu di elemen DOM sebelum datanya dibuang.
  findZeroPairIds(arr){
    const ids = [];
    ['x','unit'].forEach(type=>{
      const pos = arr.filter(t=>t.type===type && t.sign>0);
      const neg = arr.filter(t=>t.type===type && t.sign<0);
      const n = Math.min(pos.length, neg.length);
      for(let i=0;i<n;i++){ ids.push(pos[i].id, neg[i].id); }
    });
    return ids;
  },
  removeByIds(arr, idSet){
    for(let i=arr.length-1;i>=0;i--){ if(idSet.has(arr[i].id)) arr.splice(i,1); }
  },
  zeroPair(){
    const idsLeft = this.findZeroPairIds(this.left);
    const idsRight = this.findZeroPairIds(this.right);
    if(idsLeft.length===0 && idsRight.length===0){
      toast('Tidak ada pasangan nol yang bisa dihilangkan saat ini.');
      return;
    }
    const allIds = new Set([...idsLeft, ...idsRight]);
    // Mainkan animasi "meledak/menghilang" pada ubin yang akan dibuang (seperti alge_play_plsv.html)
    [this.elLeftPan, this.elRightPan].forEach(pan=>{
      if(!pan) return;
      Array.from(pan.children).forEach(el=>{
        if(allIds.has(el.dataset.id)) el.classList.add('zero-pair-anim');
      });
    });
    const btn = document.getElementById('btnZero');
    if(btn) btn.disabled = true;
    toast('💥 Pasangan nol dihilangkan!');
    setTimeout(()=>{
      this.removeByIds(this.left, new Set(idsLeft));
      this.removeByIds(this.right, new Set(idsRight));
      this.updateWork();
      this.advanceStep();
    }, 620);
  },
  // ------------------------------------------------------------------
  // LANGKAH "BAGI RATA": tidak lagi berupa tombol otomatis. Pengguna harus
  // men-drag ubin satuan dari "kumpulan" ke bawah masing-masing ubin x agar
  // terbagi rata, lalu menuliskan sendiri nilai x, baru kemudian dicek.
  // ------------------------------------------------------------------
  initDivide(){
    const lc = compileTiles(this.left), rc = compileTiles(this.right);
    this.divideNumX = Math.max(1, lc.x || this.left.filter(t=>t.type==='x').length);
    this.dividePoolSign = this.right.length ? this.right[0].sign : 1;
    this.dividePool = this.right.map(t=>({...t}));
    this.divideGroups = Array.from({length:this.divideNumX}, ()=>[]);
  },
  moveDivideTile(moveFrom, targetArr){
    if(!moveFrom) return;
    const { arr, id } = moveFrom;
    if(arr === targetArr) return;
    const idx = arr.findIndex(t=>t.id===id);
    if(idx===-1) return;
    const [tile] = arr.splice(idx,1);
    targetArr.push(tile);
    this.renderWork();
  },
  renderDivideWork(work){
    if(!this.divideGroups) this.initDivide();
    work.innerHTML = '';

    // Selama langkah bagi-rata, ubin baru tidak perlu diambil dari Bank —
    // semua ubin yang perlu dibagi sudah tersedia di kumpulan bawah.
    const bankPanel = document.getElementById('bankPanel');
    if(bankPanel){
      bankPanel.innerHTML = `<h3>Bank Ubin</h3><div class="legend-mini">🔒 Bank dikunci sementara. Semua ubin satuan yang perlu dibagi sudah ada di <b>kumpulan</b> di bawah papan kerja — seret dari sana.</div>`;
    }

    const wrap = document.createElement('div'); wrap.className='scale-wrap';
    const eq = document.createElement('div'); eq.className='eq-display'; eq.textContent = this.lvl.eq;

    const dots = document.createElement('div'); dots.className='step-progress';
    this.lvl.steps.forEach((s,i)=>{
      const d = document.createElement('div');
      d.className = 'step-dot' + (i<this.stepIndex? ' done' : (i===this.stepIndex? ' now':''));
      dots.appendChild(d);
    });

    const hintText = document.createElement('div'); hintText.className='divide-hint-text';
    hintText.innerHTML = `Seret ubin satuan dari <b>kumpulan</b> di bawah ke tiap kotak di bawah ubin <b>x</b> sampai jumlahnya <b>sama rata</b>, lalu tuliskan nilai x di panel kanan.`;

    const board = document.createElement('div'); board.className='divide-board';
    const groupsRow = document.createElement('div'); groupsRow.className='divide-groups-row';

    this.divideGroups.forEach((grp, gi)=>{
      const col = document.createElement('div'); col.className='divide-group-col';
      const cap = document.createElement('div'); cap.className='divide-group-caption'; cap.textContent = `Kelompok ${gi+1}`;
      const xTile = makeTileEl('x', 1, {sz:'board', cls:'locked'});
      const zone = document.createElement('div'); zone.className='divide-group-zone dropzone';

      grp.forEach(t=>{
        const el = makeTileEl('unit', t.sign, {sz:'board', cls:'pop-in'});
        el.addEventListener('click', (e)=>{
          e.stopPropagation();
          const idx = grp.findIndex(x=>x.id===t.id);
          if(idx>-1){ const [rt] = grp.splice(idx,1); this.dividePool.push(rt); }
          this.renderWork();
        });
        enableInstanceDrag(el, t, grp);
        zone.appendChild(el);
      });
      zone._onDrop = (type, sign, moveFrom)=>{
        if(type!=='unit'){ toast('Hanya ubin satuan yang bisa ditaruh di kelompok ini.'); return; }
        if(!moveFrom){ toast('Seret ubin dari kumpulan di bawah papan kerja 👇'); return; }
        this.moveDivideTile(moveFrom, grp);
      };

      const counts = this.divideGroups.map(g=>g.length);
      const balanced = this.dividePool.length===0 && counts.every(c=>c===counts[0]);
      if(balanced) zone.classList.add('divide-balanced');

      col.appendChild(cap); col.appendChild(xTile); col.appendChild(zone);
      groupsRow.appendChild(col);
    });
    board.appendChild(groupsRow);

    const poolWrap = document.createElement('div'); poolWrap.className='divide-pool dropzone';
    if(this.dividePool.length===0) poolWrap.classList.add('divide-empty');
    const poolLabel = document.createElement('div'); poolLabel.className='divide-pool-label';
    poolLabel.textContent = this.dividePool.length===0
      ? '✅ Semua ubin sudah terbagi!'
      : `Kumpulan Ubin Satuan (sisa ${this.dividePool.length})`;
    const poolTiles = document.createElement('div'); poolTiles.className='divide-pool-tiles';
    this.dividePool.forEach(t=>{
      const el = makeTileEl('unit', t.sign, {sz:'board', cls:'pop-in'});
      enableInstanceDrag(el, t, this.dividePool);
      poolTiles.appendChild(el);
    });
    poolWrap.appendChild(poolLabel); poolWrap.appendChild(poolTiles);
    poolWrap._onDrop = (type, sign, moveFrom)=>{
      if(!moveFrom) return;
      this.moveDivideTile(moveFrom, this.dividePool);
    };
    board.appendChild(poolWrap);

    wrap.appendChild(eq); wrap.appendChild(dots); wrap.appendChild(hintText); wrap.appendChild(board);
    work.appendChild(wrap);

    document.getElementById('exprPill').textContent = `${this.divideNumX}x  =  ${formatExpr(compileTiles(this.right))}`;
  },
  checkDivide(){
    if(!this.divideGroups) this.initDivide();
    if(this.dividePool.length > 0){
      showResultModal({icon:'🤔', title:'Belum Selesai Membagi', body:`Masih ada <b>${this.dividePool.length}</b> ubin di kumpulan bawah yang belum kamu pindahkan. Seret semua ubin itu ke salah satu kelompok x.`, actionText:'Oke'});
      return;
    }
    const counts = this.divideGroups.map(g=>g.length);
    const allEqual = counts.every(c=>c===counts[0]);
    if(!allEqual){
      showResultModal({icon:'🤔', title:'Belum Merata', body:'Jumlah ubin satuan di setiap kelompok x harus <b>sama banyak</b>. Geser ubinnya lagi supaya rata di semua kelompok.', actionText:'Coba Lagi'});
      return;
    }
    const inputEl = document.getElementById('divideXInput');
    const raw = inputEl ? inputEl.value.trim() : '';
    if(raw===''){
      showResultModal({icon:'🤔', title:'Isi Dulu Nilai x', body:'Tuliskan nilai x yang kamu temukan pada kotak di panel kanan sebelum mengecek jawaban.', actionText:'Oke'});
      return;
    }
    const val = Number(raw);
    if(Number.isNaN(val)){
      showResultModal({icon:'🤔', title:'Nilai Tidak Valid', body:'Masukkan angka yang valid untuk nilai x.', actionText:'Oke'});
      return;
    }
    const expected = counts[0] * this.dividePoolSign;
    if(val !== expected){
      showResultModal({icon:'🤔', title:'Nilai x Belum Tepat', body:`Nilai x yang kamu masukkan (<b>${val}</b>) belum sesuai dengan hasil pembagian ubin di papan kerja. Hitung ulang: setiap kelompok berisi ${counts[0]} ubin ${this.dividePoolSign<0?'negatif':'positif'}.`, actionText:'Coba Lagi'});
      return;
    }
    showResultModal({
      icon:'🎉', title:'Persamaan Terpecahkan!',
      body:`Setelah dibagi rata, ditemukan <b>x = ${expected}</b>. Timbangan tetap seimbang di setiap langkah — itulah kunci menyelesaikan persamaan linear!`,
      actionText:'Lanjut ▶️', action:()=>nextLevelOrComplete(this.m)
    });
  }
};

/* =======================================================================
   ENGINE: SQUARE (Modul Melengkapi Kuadrat Sempurna)
   ======================================================================= */
const SquareEngine = {
  start(m, lvl){
    this.m = m; this.lvl = lvl;
    this.tr = 0; this.bl = 0; this.br = new Set();
    this.stepIndex = 0; // 0: bagi ubin x, 1: lengkapi pojok, 2: tentukan jawaban
    selectedTile = null;
    renderBankSelector(document.getElementById('bankPanel'), { types:['x','unit'], allowNeg:false });
    this.renderWork();
    this.renderStatus();
  },
  need(){ return this.lvl.n * this.lvl.n; },
  renderWork(){
    const work = document.getElementById('workArea');
    work.innerHTML = '';

    const dots = document.createElement('div'); dots.className='step-progress';
    for(let i=0;i<3;i++){
      const d = document.createElement('div');
      d.className = 'step-dot' + (i<this.stepIndex? ' done' : (i===this.stepIndex? ' now':''));
      dots.appendChild(d);
    }
    work.appendChild(dots);

    const sq = document.createElement('div'); sq.className='square-wrap';
    const locked = this.stepIndex>=2; // di langkah "Tentukan Jawaban", susunan dikunci agar tidak berubah lagi

    // Row 1: TL (x2 fixed) + TR (strip of vertical x tiles)
    const row1 = document.createElement('div'); row1.className='quad-row';
    const tl = document.createElement('div'); tl.className='quad-tl';
    tl.style.width='var(--len)'; tl.style.height='var(--len)';
    tl.appendChild(makeTileEl('x2',1,{sz:'board', cls:'locked'}));
    row1.appendChild(tl);

    const tr = document.createElement('div'); tr.className='quad-strip tr' + (locked? '' : ' dropzone');
    tr.style.height='var(--len)'; tr.style.minWidth='var(--u)';
    for(let i=0;i<this.tr;i++){
      const el = makeTileEl('x',1,{sz:'board', cls:'pop-in'});
      if(!locked) el.addEventListener('click', (e)=>{ e.stopPropagation(); this.tr--; this.cleanBr(); this.renderWork(); });
      tr.appendChild(el);
    }
    if(!locked) tr._onDrop = (type)=>{
      if(this.stepIndex!==0){ toast('Selesaikan langkah ini dulu ya.'); return; }
      if(type!=='x'){ toast('Hanya ubin x yang bisa ditaruh di sisi ini.'); return; }
      this.tr++; this.renderWork();
    };
    row1.appendChild(tr);

    // Row 2: BL (strip of horizontal x tiles) + BR (unit grid)
    const row2 = document.createElement('div'); row2.className='quad-row';
    const bl = document.createElement('div'); bl.className='quad-strip bl' + (locked? '' : ' dropzone');
    bl.style.width='var(--len)'; bl.style.minHeight='var(--u)';
    for(let i=0;i<this.bl;i++){
      const el = makeTileEl('x',1,{sz:'board', horiz:true, cls:'pop-in'});
      if(!locked) el.addEventListener('click', (e)=>{ e.stopPropagation(); this.bl--; this.cleanBr(); this.renderWork(); });
      bl.appendChild(el);
    }
    if(!locked) bl._onDrop = (type)=>{
      if(this.stepIndex!==0){ toast('Selesaikan langkah ini dulu ya.'); return; }
      if(type!=='x'){ toast('Hanya ubin x yang bisa ditaruh di sisi ini.'); return; }
      this.bl++; this.renderWork();
    };
    row2.appendChild(bl);

    const br = document.createElement('div'); br.className='quad-br';
    if(this.tr===0 || this.bl===0){
      br.style.width='var(--u)'; br.style.height='var(--u)';
      br.innerHTML = '<div class="grid-placeholder" style="font-size:.65rem;padding:2px;">Isi ubin x dulu</div>';
    } else {
      br.style.gridTemplateColumns = `repeat(${this.tr}, var(--u))`;
      br.style.gridTemplateRows = `repeat(${this.bl}, var(--u))`;
      for(let i=0;i<this.bl;i++){
        for(let j=0;j<this.tr;j++){
          const key = `${i}-${j}`;
          const cell = document.createElement('div'); cell.className='grid-cell';
          if(this.br.has(key)){
            const el = makeTileEl('unit',1,{sz:'board'});
            el.style.width='100%'; el.style.height='100%';
            if(!locked) el.addEventListener('click', (e)=>{ e.stopPropagation(); this.br.delete(key); this.renderWork(); });
            cell.appendChild(el);
          } else {
            if(!locked){
              cell.classList.add('dropzone');
              cell._onDrop = (type)=>{
                if(this.stepIndex!==1){ toast('Selesaikan langkah "Bagi Ubin x" dulu ya.'); return; }
                if(type!=='unit'){ toast('Hanya ubin +1 yang bisa mengisi pojok ini.'); return; }
                this.br.add(key); this.renderWork();
              };
            }
          }
          br.appendChild(cell);
        }
      }
    }
    row2.appendChild(br);

    sq.appendChild(row1); sq.appendChild(row2);
    work.appendChild(sq);
    this.updateExprPill();
    this.syncExprText();
  },
  cleanBr(){
    const valid = new Set();
    this.br.forEach(key=>{
      const [i,j] = key.split('-').map(Number);
      if(i < this.bl && j < this.tr) valid.add(key);
    });
    this.br = valid;
  },
  updateExprPill(){
    document.getElementById('exprPill').textContent = `x² + ${this.tr + this.bl}x + ${this.br.size}`;
  },
  renderStatus(){
    const panel = document.getElementById('statusPanel');
    const lvl = this.lvl;
    const step = this.stepIndex;

    let stepBadge, stepDesc, stepHint, actionsHtml;

    if(step===0){
      stepBadge = `${lvl.badge||'Misi'} · Langkah 1/3`;
      stepDesc = lvl.desc;
      stepHint = lvl.hint;
      actionsHtml = `<button class="btn btn-primary btn-block" id="btnStepCheck">✅ Cek Pembagian</button>`;
    } else if(step===1){
      stepBadge = `${lvl.badge||'Misi'} · Langkah 2/3`;
      stepDesc = `<b>Lengkapi Pojok Kosong:</b><br><br>Bagus, ubin <b>x</b> sudah terbagi rata! Sekarang perhatikan pojok kanan-bawah yang masih kosong.<br><br><b>Misi:</b> Seret ubin <b>satuan (+1)</b> dari Bank Ubin ke pojok itu sampai penuh membentuk persegi utuh.`;
      stepHint = `Ukuran pojok kosong itu adalah ${this.tr} × ${this.bl} ubin.`;
      actionsHtml = `<button class="btn btn-primary btn-block" id="btnStepCheck">✅ Cek Persegi</button>`;
    } else {
      stepBadge = `${lvl.badge||'Misi'} · Langkah 3/3`;
      stepDesc = `<b>Tentukan Jawaban:</b><br><br>Persegi utuh sudah terbentuk 🎉 Sebelum lanjut, jawab dulu dua pertanyaan berikut sesuai hasil susunanmu di papan kerja.`;
      stepHint = `Hitung dari papan kerja: berapa ubin satuan di pojok kanan-bawah, dan berapa ubin x di satu sisi (kanan atau bawah saja)?`;
      actionsHtml = `<button class="btn btn-primary btn-block" id="btnAnswerCheck">✅ Periksa Jawaban</button>`;
    }

    panel.innerHTML = `
      <div class="mission-card">
        <div class="mission-badge">${stepBadge}</div>
        <div class="mission-title">${lvl.title}</div>
        <div class="mission-desc">${stepDesc}</div>
        ${stepHint? `<div class="mission-hint">💡 <b>Petunjuk:</b> ${stepHint}</div>` : ''}
      </div>
      <div class="status-box">
        <div class="status-label">Bentuk Aljabar Saat Ini</div>
        <div class="status-val" id="statusExpr">0</div>
      </div>
      ${step===2 ? `
      <div class="status-box">
        <div class="status-label">Jawabanmu</div>
        <div class="divide-input-row">
          <span class="xlbl">Ubin satuan yang dibutuhkan =</span>
          <input type="number" step="1" min="0" class="divide-input" id="squareUnitInput" placeholder="?">
        </div>
        <div class="divide-input-row">
          <span class="xlbl">(x + n)² &nbsp;→&nbsp; n =</span>
          <input type="number" step="1" min="0" class="divide-input" id="squareNInput" placeholder="?">
        </div>
      </div>` : ''}
      <div class="status-actions">
        ${actionsHtml}
        ${step<2 ? `<button class="btn btn-clear btn-block" id="btnClear">🗑️ Bersihkan</button>` : ''}
        <button class="btn btn-clear btn-block" id="btnReset">↩️ Ulangi dari Awal</button>
      </div>
    `;
    this.syncExprText();
    if(step===0 || step===1) document.getElementById('btnStepCheck').addEventListener('click', ()=> this.checkStep());
    if(step===2) document.getElementById('btnAnswerCheck').addEventListener('click', ()=> this.checkAnswer());
    if(step<2) document.getElementById('btnClear').addEventListener('click', ()=>{ this.tr=0; this.bl=0; this.br=new Set(); this.renderWork(); });
    document.getElementById('btnReset').addEventListener('click', ()=>{ clearTapSelection(); this.start(this.m, this.lvl); });
  },
  syncExprText(){
    const el = document.getElementById('statusExpr');
    if(el) el.textContent = `${this.tr} (kanan) + ${this.bl} (bawah) = ${this.tr+this.bl}x  ,  satuan = ${this.br.size}`;
  },
  advanceStep(){
    this.stepIndex++;
    this.renderWork();
    this.renderStatus();
    toast('👍 Langkah selesai! Lanjut ke langkah berikutnya.');
  },
  checkStep(){
    const lvl = this.lvl;
    if(this.stepIndex===0){
      if(this.tr !== this.bl){
        showResultModal({icon:'🤔', title:'Belum Simetris', body:'Jumlah ubin x di kanan dan di bawah harus <b>sama banyak</b> agar bisa membentuk persegi yang simetris.', actionText:'Coba Lagi'});
        return;
      }
      if(this.tr === 0){
        showResultModal({icon:'🤔', title:'Belum Dimulai', body:'Tambahkan ubin x terlebih dahulu di sisi kanan dan bawah.', actionText:'Oke'});
        return;
      }
      if(this.tr + this.bl !== lvl.b){
        showResultModal({icon:'🤔', title:'Jumlah Belum Sesuai', body:`Total ubin x saat ini adalah ${this.tr+this.bl}, sedangkan misi meminta total <b>${lvl.b}x</b>. Sesuaikan jumlah ubinnya.`, actionText:'Coba Lagi'});
        return;
      }
      this.advanceStep();
      return;
    }
    if(this.stepIndex===1){
      const need = this.need();
      if(this.br.size < need){
        showResultModal({icon:'🤔', title:'Belum Lengkap', body:`Pojok kanan-bawah masih membutuhkan <b>${need - this.br.size}</b> ubin satuan lagi agar penuh.`, actionText:'Oke'});
        return;
      }
      this.advanceStep();
      return;
    }
  },
  // Langkah 3: siswa MENULISKAN sendiri jawabannya (bukan hanya membaca kesimpulan) —
  // (1) berapa ubin satuan yang dibutuhkan, dan (2) berapa nilai n pada (x+n)².
  checkAnswer(){
    const lvl = this.lvl;
    const need = this.need();
    const unitEl = document.getElementById('squareUnitInput');
    const nEl = document.getElementById('squareNInput');
    const unitRaw = unitEl ? unitEl.value.trim() : '';
    const nRaw = nEl ? nEl.value.trim() : '';

    if(unitRaw==='' || nRaw===''){
      showResultModal({icon:'🤔', title:'Isi Dulu Jawabanmu', body:'Isi kedua kotak jawaban terlebih dahulu: jumlah ubin satuan dan nilai n, sebelum diperiksa.', actionText:'Oke'});
      return;
    }
    const unitVal = Number(unitRaw), nVal = Number(nRaw);
    if(Number.isNaN(unitVal) || Number.isNaN(nVal)){
      showResultModal({icon:'🤔', title:'Nilai Tidak Valid', body:'Masukkan angka yang valid pada kedua kotak jawaban.', actionText:'Oke'});
      return;
    }
    if(unitVal !== need && nVal !== lvl.n){
      showResultModal({icon:'🤔', title:'Dua-duanya Belum Tepat', body:`Coba hitung ulang dari papan kerja: jumlah ubin satuan di pojok, dan berapa ubin x di satu sisi saja (itulah nilai n).`, actionText:'Coba Lagi'});
      return;
    }
    if(unitVal !== need){
      showResultModal({icon:'🤔', title:'Jumlah Ubin Satuan Belum Tepat', body:`Hitung lagi luas pojok kanan-bawah pada papan kerja (panjang × lebar). Petunjuk: nilai n yang kamu masukkan sudah benar, gunakan itu untuk menghitung n × n.`, actionText:'Coba Lagi'});
      return;
    }
    if(nVal !== lvl.n){
      showResultModal({icon:'🤔', title:'Nilai n Belum Tepat', body:`Lihat satu sisi papan kerja (kanan atau bawah saja) — berapa banyak ubin x di sana? Itulah nilai n pada bentuk (x+n)².`, actionText:'Coba Lagi'});
      return;
    }
    showResultModal({
      icon:'🎉', title:'Kuadrat Sempurna Terbentuk!',
      body:`Jawabanmu tepat! Dengan menambahkan <b>${need} ubin satuan</b>, terbentuklah persegi utuh berukuran (x + ${lvl.n}) × (x + ${lvl.n}).<br><br><b>x² + ${lvl.b}x + ${need} = (x + ${lvl.n})²</b>`,
      actionText:'Lanjut ▶️', action:()=>nextLevelOrComplete(this.m)
    });
  }
};

/* =======================================================================
   ENGINE: QUIZ (Modul Evaluasi Akhir)
   ======================================================================= */
const QuizEngine = {
  start(m){
    this.m = m;
    this.qIndex = 0; this.score = 0; this.answered = false;
    document.getElementById('statusPanel').innerHTML = '';
    this.renderQuestion();
  },
  updateScorePill(){
    document.getElementById('exprPill').textContent = `Skor: ${this.score} / ${this.m.questions.length}`;
  },
  typeLabel(type){
    switch(type){
      case 'mc_multi': return '☑️ Pilihan Ganda Kompleks';
      case 'tf': return '✅ Benar / Salah';
      case 'match': return '🔗 Menjodohkan';
      default: return '🔘 Pilihan Ganda';
    }
  },
  renderQuestion(){
    const work = document.getElementById('workArea');
    this.updateScorePill();
    const q = this.m.questions[this.qIndex];
    this.answered = false;
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.innerHTML = `
      <div class="quiz-progress">Soal ${this.qIndex+1} dari ${this.m.questions.length}</div>
      <div class="quiz-type-badge">${this.typeLabel(q.type)}</div>
      <div class="quiz-q">${q.q}</div>
      <div id="quizBody"></div>
      <div id="quizExplain"></div>
    `;
    work.innerHTML = ''; work.appendChild(card);

    const type = q.type || 'mc';
    if(type==='mc') this.renderMC(q);
    else if(type==='mc_multi') this.renderMultiMC(q);
    else if(type==='tf') this.renderTF(q);
    else if(type==='match') this.renderMatch(q);
  },
  goNextOrResult(){
    if(this.qIndex < this.m.questions.length-1){ this.qIndex++; this.renderQuestion(); }
    else this.renderResult();
  },
  showExplain(isCorrect, exp){
    this.updateScorePill();
    const exp2 = document.getElementById('quizExplain');
    exp2.innerHTML = `<div class="quiz-explain"><b>${isCorrect?'Benar! 🎉':'Belum tepat.'}</b> ${exp}</div>
      <button class="btn btn-primary btn-block" style="margin-top:14px;" id="quizNext">${this.qIndex < this.m.questions.length-1 ? 'Soal Berikutnya →' : 'Lihat Hasil 🏆'}</button>`;
    document.getElementById('quizNext').addEventListener('click', ()=> this.goNextOrResult());
  },
  // ---------- Tipe: Pilihan Ganda (1 jawaban) ----------
  renderMC(q){
    const body = document.getElementById('quizBody');
    q.opts.forEach((opt, i)=>{
      const btn = document.createElement('button');
      btn.className = 'quiz-opt'; btn.textContent = opt;
      btn.addEventListener('click', ()=> this.answerMC(i));
      body.appendChild(btn);
    });
  },
  answerMC(i){
    if(this.answered) return;
    this.answered = true;
    const q = this.m.questions[this.qIndex];
    const opts = document.querySelectorAll('#quizBody .quiz-opt');
    opts.forEach((btn, idx)=>{
      btn.disabled = true;
      if(idx===q.correct) btn.classList.add('correct');
      else if(idx===i) btn.classList.add('wrong');
    });
    const isCorrect = i===q.correct;
    if(isCorrect) this.score++;
    this.showExplain(isCorrect, q.exp);
  },
  // ---------- Tipe: Pilihan Ganda Kompleks (banyak jawaban) ----------
  renderMultiMC(q){
    const body = document.getElementById('quizBody');
    this._multiSelected = new Set();
    q.opts.forEach((opt, i)=>{
      const btn = document.createElement('button');
      btn.className = 'quiz-opt'; 
      btn.innerHTML = `<span class="opt-check">☐</span> ${opt}`;
      btn.addEventListener('click', ()=>{
        if(this.answered) return;
        if(this._multiSelected.has(i)){ this._multiSelected.delete(i); btn.classList.remove('selected'); btn.querySelector('.opt-check').textContent='☐'; }
        else { this._multiSelected.add(i); btn.classList.add('selected'); btn.querySelector('.opt-check').textContent='☑️'; }
      });
      body.appendChild(btn);
    });
    const submitBtn = document.createElement('button');
    submitBtn.className = 'btn btn-primary btn-block'; submitBtn.style.marginTop='14px';
    submitBtn.textContent = 'Periksa Jawaban ✅';
    submitBtn.addEventListener('click', ()=> this.answerMultiMC());
    body.appendChild(submitBtn);
  },
  answerMultiMC(){
    if(this.answered) return;
    const q = this.m.questions[this.qIndex];
    if(this._multiSelected.size===0){ toast('Pilih minimal satu jawaban dulu ya.'); return; }
    this.answered = true;
    const correctSet = new Set(q.correct);
    const opts = document.querySelectorAll('#quizBody .quiz-opt');
    let allMatch = correctSet.size === this._multiSelected.size;
    opts.forEach((btn, idx)=>{
      btn.disabled = true;
      btn.classList.remove('selected');
      const isSel = this._multiSelected.has(idx);
      const isCorrectOpt = correctSet.has(idx);
      if(isSel && !isCorrectOpt){ btn.classList.add('wrong'); allMatch = false; }
      else if(isCorrectOpt && !isSel){ btn.classList.add('missed'); allMatch = false; }
      else if(isCorrectOpt && isSel){ btn.classList.add('correct'); }
    });
    const submitBtn = document.querySelector('#quizBody .btn-primary');
    if(submitBtn) submitBtn.remove();
    if(allMatch) this.score++;
    this.showExplain(allMatch, q.exp);
  },
  // ---------- Tipe: Benar / Salah ----------
  renderTF(q){
    const body = document.getElementById('quizBody');
    const row = document.createElement('div'); row.className='quiz-tf-row';
    const btnTrue = document.createElement('button'); btnTrue.className='quiz-opt'; btnTrue.textContent='✅ Benar';
    const btnFalse = document.createElement('button'); btnFalse.className='quiz-opt'; btnFalse.textContent='❌ Salah';
    btnTrue.addEventListener('click', ()=> this.answerTF(true, btnTrue, btnFalse));
    btnFalse.addEventListener('click', ()=> this.answerTF(false, btnTrue, btnFalse));
    row.appendChild(btnTrue); row.appendChild(btnFalse);
    body.appendChild(row);
  },
  answerTF(val, btnTrue, btnFalse){
    if(this.answered) return;
    this.answered = true;
    const q = this.m.questions[this.qIndex];
    btnTrue.disabled = true; btnFalse.disabled = true;
    const correctBtn = q.correct ? btnTrue : btnFalse;
    const chosenBtn = val ? btnTrue : btnFalse;
    correctBtn.classList.add('correct');
    if(chosenBtn !== correctBtn) chosenBtn.classList.add('wrong');
    const isCorrect = val === q.correct;
    if(isCorrect) this.score++;
    this.showExplain(isCorrect, q.exp);
  },
  // ---------- Tipe: Menjodohkan ----------
  renderMatch(q){
    const body = document.getElementById('quizBody');
    const rowsWrap = document.createElement('div');
    q.left.forEach((ltext, i)=>{
      const row = document.createElement('div'); row.className='quiz-match-row';
      const label = document.createElement('div'); label.className='quiz-match-left';
      label.innerHTML = `${i+1}. ${ltext}`;
      const sel = document.createElement('select'); sel.className='quiz-match-select'; sel.id=`quizMatchSel${i}`;
      const placeholder = document.createElement('option'); placeholder.value=''; placeholder.textContent='-- pilih --';
      sel.appendChild(placeholder);
      q.right.forEach((rtext, j)=>{
        const opt = document.createElement('option'); opt.value=String(j);
        opt.textContent = `${String.fromCharCode(65+j)}. ${rtext}`;
        sel.appendChild(opt);
      });
      row.appendChild(label); row.appendChild(sel);
      rowsWrap.appendChild(row);
    });
    body.appendChild(rowsWrap);
    const submitBtn = document.createElement('button');
    submitBtn.className = 'btn btn-primary btn-block'; submitBtn.style.marginTop='14px';
    submitBtn.textContent = 'Periksa Jawaban ✅';
    submitBtn.addEventListener('click', ()=> this.answerMatch(q));
    body.appendChild(submitBtn);
  },
  answerMatch(q){
    if(this.answered) return;
    const rows = document.querySelectorAll('#quizBody .quiz-match-row');
    const chosen = [];
    for(let i=0;i<q.left.length;i++){
      const sel = document.getElementById(`quizMatchSel${i}`);
      if(!sel.value){ toast('Lengkapi semua pasangan dulu ya.'); return; }
      chosen.push(Number(sel.value));
    }
    this.answered = true;
    let allMatch = true;
    rows.forEach((row, i)=>{
      const sel = document.getElementById(`quizMatchSel${i}`);
      sel.disabled = true;
      const ok = chosen[i] === q.correct[i];
      row.classList.add(ok? 'correct' : 'wrong');
      if(!ok) allMatch = false;
    });
    const submitBtn = document.querySelector('#quizBody .btn-primary');
    if(submitBtn) submitBtn.remove();
    if(allMatch) this.score++;
    this.showExplain(allMatch, q.exp);
  },
  renderResult(){
    const total = this.m.questions.length;
    const pct = Math.round((this.score/total)*100);
    const pass = pct >= 60;
    const badge = pct>=90? '🥇' : pct>=75? '🥈' : pct>=60? '🥉' : '📘';
    const work = document.getElementById('workArea');
    const card = document.createElement('div');
    card.className = 'quiz-card quiz-result';
    card.innerHTML = `
      <div class="quiz-badge">${badge}</div>
      <h2 style="margin:6px 0;">${pass? 'Selamat, Kamu Lulus!' : 'Terus Berlatih!'}</h2>
      <div class="quiz-score">${this.score}/${total}</div>
      <p style="color:var(--ink-soft);">Skor kamu: ${pct}%</p>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button class="btn btn-clear" id="btnRetry" style="flex:1;">🔁 Ulangi Kuis</button>
        <button class="btn btn-primary" id="btnFinish" style="flex:1;">${pass? 'Selesai 🎉' : 'Kembali'}</button>
      </div>
    `;
    work.innerHTML = ''; work.appendChild(card);
    document.getElementById('btnRetry').addEventListener('click', ()=> this.start(this.m));
    document.getElementById('btnFinish').addEventListener('click', ()=>{
      if(pass){
        this.m.completed = true;
        showResultModal({
          icon:'🏆', title:'Kamu Master Aljabar!',
          body:'Kamu telah menyelesaikan seluruh perjalanan belajar di Algebra Tiles : Ubin Aljabar. Hebat sekali!',
          actionText:'Kembali ke Peta Belajar', action:()=> goHome()
        });
      } else {
        goHome();
      }
    });
  }
};

</script>
</body>
</html>
